name = "xz"
version = "5.8.3"
description = "LFS 13.1 §6.16 - Xz (temporary)"
dependencies = ["tar"]
source_url = "https://github.com//tukaani-project/xz/releases/download/v5.8.3/xz-5.8.3.tar.xz"
sha256_sum = "fff1ffcf2b0da84d308a14de513a1aa23d4e9aa3464d17e64b9714bfdd0bbfb6"
build_commands = [
  'umask 022; export PATH=$LFS/tools/bin:/usr/bin:/bin CONFIG_SITE=$LFS/usr/share/config.site LC_ALL=POSIX',
  '''
./configure --prefix=/usr                     \
            --host=$LFS_TGT                   \
            --build=$(build-aux/config.guess) \
            --disable-static                  \
            --docdir=/usr/share/doc/xz-5.8.3''',
  'make',
]
install_commands = [
  'make DESTDIR=$DESTDIR$LFS install',
  'rm -v $DESTDIR$LFS/usr/lib/liblzma.la',
]
