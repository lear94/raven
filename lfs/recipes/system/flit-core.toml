name = "flit-core"
version = "4.0.2"
description = "LFS 13.1 §8.55 - Minimal build backend for Python packages"
dependencies = ["python"]
source_url = "https://pypi.org/packages/source/f/flit-core/flit_core-4.0.2.tar.gz"
sha256_sum = "b6929defd93884b584d7c87829e0e7b5c26ed6be17b0b873979019314aa841c8"
build_commands = [
  "pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD",
]
install_commands = [
  '''
# Book: pip3 install --no-index --find-links dist flit_core
# --root=$DESTDIR installs into /out. --ignore-installed and --no-deps keep
# pip from looking at (or trying to uninstall from) the read-only live
# system, e.g. when an older version is already installed.
pip3 install --no-index --no-deps --ignore-installed --no-user \
             --no-cache-dir --root=$DESTDIR --find-links dist flit_core
''',
]
