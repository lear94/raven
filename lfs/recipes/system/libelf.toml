name = "libelf"
version = "0.195"
description = "LFS 13.1 §8.50 - Libelf from Elfutils, a library for handling ELF files"
dependencies = ["openssl"]
source_url = "https://sourceware.org/ftp/elfutils/0.195/elfutils-0.195.tar.bz2"
sha256_sum = "37629fdf7f1f3dc2818e138fca2b8094177d6c2d0f701d3bb650a561218dc026"
build_commands = [
  '''
./configure --prefix=/usr        \
            --disable-debuginfod \
            --enable-libdebuginfod=dummy
''',
  "make -C lib",
  "make -C libelf",
]
install_commands = [
  "make -C libelf DESTDIR=$DESTDIR install",
  "install -vDm644 config/libelf.pc -t $DESTDIR/usr/lib/pkgconfig",
  "rm $DESTDIR/usr/lib/libelf.a",
]
