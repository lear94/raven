name = "systemd"
version = "261.2"
description = "LFS 13.1 §8.77 - Programs for controlling the startup, running, and shutdown of the system"
dependencies = ["jinja2"]
source_url = "https://github.com/systemd/systemd/archive/v261.2/systemd-261.2.tar.gz"
sha256_sum = "ed1059ff964f5df35b6056434cc17cc83f86dc913f10489948a0b19b6081c5ec"
extra_sources = [
  { url = "https://anduin.linuxfromscratch.org/LFS/systemd-man-pages-261.2.tar.xz", sha256_sum = "9be13865c9c7f9fecba7b86fc5185aecef00164c87ed68b4f6884283aefebe50" },
]
build_commands = [
  '''
sed -e 's/GROUP="render"/GROUP="video"/' \
    -e 's/GROUP="sgx", //'               \
    -i rules.d/50-udev-default.rules.in''',
  '''
mkdir -p build
cd       build''',
  '''
meson setup ..                \
      --prefix=/usr           \
      --buildtype=release     \
      -D default-dnssec=no    \
      -D firstboot=false      \
      -D install-tests=false  \
      -D ldconfig=false       \
      -D sysusers=false       \
      -D rpmmacrosdir=no      \
      -D homed=disabled       \
      -D man=disabled         \
      -D mode=release         \
      -D pamconfdir=no        \
      -D dev-kvm-mode=0660    \
      -D nobody-group=nogroup \
      -D sysupdate=disabled   \
      -D ukify=disabled       \
      -D docdir=/usr/share/doc/systemd-261.2''',
  'ninja',
]
install_commands = [
  '# meson honours the exported DESTDIR=/out',
  'ninja install',
  '''
install -vd $DESTDIR/usr/share/man
tar -xf $RAVEN_SOURCES/systemd-man-pages-261.2.tar.xz \
    --no-same-owner --strip-components=1     \
    -C $DESTDIR/usr/share/man''',
]
post_install_commands = [
  'systemd-machine-id-setup',
  'systemctl preset-all',
]
