name = "setuptools"
version = "84.0.0"
description = "LFS 13.1 §8.58 - Tools to download, build, install, upgrade and uninstall Python packages"
dependencies = ["wheel"]
source_url = "https://pypi.org/packages/source/s/setuptools/setuptools-84.0.0.tar.gz"
sha256_sum = "f4695c21257f0d9b537ec2692c941d02ee143b7cc1276941349a546573b2ef73"
build_commands = [
  'pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD',
]
install_commands = [
  '''
# --ignore-installed/--no-deps (not in the book): with --root, pip still
# inspects the live site-packages; without them a reinstall would be a no-op
# ("already satisfied") or try to uninstall from the read-only live /usr.
pip3 install --no-index --no-user --root=$DESTDIR --ignore-installed --no-deps --find-links dist setuptools''',
]
