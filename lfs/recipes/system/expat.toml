name = "expat"
version = "2.8.3"
description = "LFS 13.1 §8.43 - Stream-oriented C library for parsing XML"
dependencies = ["gperf"]
source_url = "https://github.com/libexpat/libexpat/releases/download/R_2_8_3/expat-2.8.3.tar.xz"
sha256_sum = "f6256df90c906773d344da084402b7d3e4f22ed41b1a59c989098a83d3ea0c85"
build_commands = [
  '''
./configure --prefix=/usr    \
            --disable-static \
            --docdir=/usr/share/doc/expat-2.8.3
''',
  "make",
]
install_commands = [
  "make DESTDIR=$DESTDIR install",
  "install -vd $DESTDIR/usr/share/doc/expat-2.8.3 && install -v -m644 doc/*.{html,css} $DESTDIR/usr/share/doc/expat-2.8.3",
]
