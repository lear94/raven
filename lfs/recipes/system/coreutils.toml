name = "coreutils"
version = "9.11"
description = "LFS 13.1 §8.61 - Utilities for showing and setting basic system characteristics"
dependencies = ["kmod"]
source_url = "https://ftpmirror.gnu.org/coreutils/coreutils-9.11.tar.xz"
sha256_sum = "394024eda0a5955217ceda9cd1201e65dc8fa3aa29c2951135a49521d57c3cc3"
extra_sources = [
  { url = "https://www.linuxfromscratch.org/patches/lfs/13.1/coreutils-9.11-i18n-1.patch", sha256_sum = "7c2aecf9ae24b87b019595e382b9f41d2c96de7f95abe95ad8cacc7e2ce1bbcc" },
]
build_commands = [
  'patch -Np1 -i $RAVEN_SOURCES/coreutils-9.11-i18n-1.patch',
  '''
autoreconf -fv
automake -af
FORCE_UNSAFE_CONFIGURE=1 ./configure \
            --prefix=/usr''',
  'make',
]
install_commands = [
  'make DESTDIR=$DESTDIR install',
  '''
install -vd $DESTDIR/usr/sbin $DESTDIR/usr/share/man/man8
mv -v $DESTDIR/usr/bin/chroot $DESTDIR/usr/sbin
mv -v $DESTDIR/usr/share/man/man1/chroot.1 $DESTDIR/usr/share/man/man8/chroot.8
sed -i 's/"1"/"8"/' $DESTDIR/usr/share/man/man8/chroot.8''',
]
