name = "util-linux"
version = "2.42.2"
description = "LFS 13.1 §8.81 - Miscellaneous utility programs"
dependencies = ["procps-ng"]
source_url = "https://www.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
sha256_sum = "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"
build_commands = [
  '''
# Final build; replaces the chapter 7 temporary util-linux (tracked in the
# separate temp/ database, so Raven treats those files as untracked).
./configure --bindir=/usr/bin     \
            --libdir=/usr/lib     \
            --runstatedir=/run    \
            --sbindir=/usr/sbin   \
            --disable-chfn-chsh   \
            --disable-login       \
            --disable-nologin     \
            --disable-su          \
            --disable-setpriv     \
            --disable-runuser     \
            --disable-pylibmount  \
            --disable-liblastlog2 \
            --disable-static      \
            --without-python      \
            ADJTIME_PATH=/var/lib/hwclock/adjtime \
            --docdir=/usr/share/doc/util-linux-2.42.2''',
  'make',
]
install_commands = [
  'make DESTDIR=$DESTDIR install',
]
