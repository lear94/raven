name = "bzip2"
version = "1.0.8"
description = "LFS 13.1 §8.7 - Bzip2 compression programs and library"
dependencies = ["zlib"]
source_url = "https://www.sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz"
sha256_sum = "ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269"
extra_sources = [
  { url = "https://www.linuxfromscratch.org/patches/lfs/13.1/bzip2-1.0.8-install_docs-1.patch", sha256_sum = "35e3bbd9642af51fef2a8a83afba040d272da42d7e3a251d8e43255a7b496702" },
]
build_commands = [
  'patch -Np1 -i $RAVEN_SOURCES/bzip2-1.0.8-install_docs-1.patch',
  "sed -i 's@\\(ln -s -f \\)$(PREFIX)/bin/@\\1@' Makefile",
  'sed -i "s@(PREFIX)/man@(PREFIX)/share/man@g" Makefile',
  '''
make -f Makefile-libbz2_so
make clean''',
  'make',
]
install_commands = [
  '# Bzip2 has no DESTDIR support: install with PREFIX pointing into $DESTDIR',
  'make PREFIX=$DESTDIR/usr install',
  '''
cp -av libbz2.so.* $DESTDIR/usr/lib
ln -sfv libbz2.so.1.0.8 $DESTDIR/usr/lib/libbz2.so''',
  'ln -sfv libbz2.so.1.0.8 $DESTDIR/usr/lib/libbz2.so.1',
  '''
cp -v bzip2-shared $DESTDIR/usr/bin/bzip2
for i in $DESTDIR/usr/bin/{bzcat,bunzip2}; do
  ln -sfv bzip2 $i
done''',
  'rm -fv $DESTDIR/usr/lib/libbz2.a',
]
