name = "binutils"
version = "2.47"
description = "LFS 13.1 §8.22 - GNU binary utilities"
dependencies = ["pkgconf"]
source_url = "https://sourceware.org/pub/binutils/releases/binutils-2.47.tar.xz"
sha256_sum = "154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff"
build_commands = [
  '''
mkdir -v build
cd       build''',
  '''
../configure --prefix=/usr       \
             --sysconfdir=/etc   \
             --enable-ld=default \
             --enable-plugins    \
             --enable-shared     \
             --disable-werror    \
             --enable-64-bit-bfd \
             --enable-new-dtags  \
             --with-system-zlib  \
             --with-lib-path=/usr/lib \
             --enable-default-hash-style=gnu''',
  'make tooldir=/usr',
  '# The book calls the Binutils test suite (make -k check) critical; it is skipped here.',
]
install_commands = [
  'make tooldir=/usr DESTDIR=$DESTDIR install',
  '''
rm -rfv $DESTDIR/usr/lib/lib{bfd,ctf,ctf-nobfd,gprofng,opcodes,sframe}.a \
        $DESTDIR/usr/share/doc/gprofng/''',
]
