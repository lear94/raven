name = "ninja"
version = "1.13.2"
description = "LFS 13.1 §8.20 - Ninja small build system"
dependencies = ["dejagnu"]
source_url = "https://github.com/ninja-build/ninja/archive/v1.13.2/ninja-1.13.2.tar.gz"
sha256_sum = "974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17"
build_commands = [
  '''
sed -i '/int Guess/a \
  int   j = 0;\
  char* jobs = getenv( "NINJAJOBS" );\
  if ( jobs != NULL ) j = atoi( jobs );\
  if ( j > 0 ) return j;\
' src/ninja.cc''',
  'python3 configure.py --bootstrap --verbose',
]
install_commands = [
  '''
install -vDm755 ninja $DESTDIR/usr/bin/ninja
install -vDm644 misc/bash-completion $DESTDIR/usr/share/bash-completion/completions/ninja
install -vDm644 misc/zsh-completion  $DESTDIR/usr/share/zsh/site-functions/_ninja''',
]
