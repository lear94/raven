name = "wheel"
version = "0.48.0"
description = "LFS 13.1 §8.57 - Reference implementation of the Python wheel packaging standard"
dependencies = ["packaging"]
source_url = "https://pypi.org/packages/source/w/wheel/wheel-0.48.0.tar.gz"
sha256_sum = "94800765601e9171bf5d58d066e640662842bcedcbab982b2c90787a2c987322"
build_commands = [
  "pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD",
]
install_commands = [
  '''
# Book: pip3 install --no-index --find-links dist wheel
# --root=$DESTDIR installs into /out. --ignore-installed and --no-deps keep
# pip from looking at (or trying to uninstall from) the read-only live
# system, e.g. when an older version is already installed.
pip3 install --no-index --no-deps --ignore-installed --no-user \
             --no-cache-dir --root=$DESTDIR --find-links dist wheel
''',
]
