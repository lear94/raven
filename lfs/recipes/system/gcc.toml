name = "gcc"
version = "16.2.0"
description = "LFS 13.1 §8.32 - GNU Compiler Collection (C and C++)"
dependencies = ["gawk"]
source_url = "https://ftpmirror.gnu.org/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz"
sha256_sum = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"
build_commands = [
  '''
# Book: x86_64 only. The aarch64 branch is added so 64-bit libraries also go
# to /usr/lib on arm64 (MULTILIB_OSDIRNAMES = mabi.lp64=../lib64...).
case $(uname -m) in
  x86_64)
    sed -e '/m64=/s/lib64/lib/' \
        -i.orig gcc/config/i386/t-linux64
  ;;
  aarch64)
    sed -e '/mabi.lp64=/s/lib64/lib/' \
        -i.orig gcc/config/aarch64/t-aarch64-linux
  ;;
esac
''',
  '''
mkdir -v build
cd       build
''',
  '''
../configure --prefix=/usr            \
             LD=ld                    \
             --enable-languages=c,c++ \
             --enable-default-pie     \
             --enable-default-ssp     \
             --enable-host-pie        \
             --enable-targets=all     \
             --disable-multilib       \
             --disable-bootstrap      \
             --disable-fixincludes    \
             --with-system-zlib
''',
  "make",
  '''
# The GCC test suite is critical in the book (make -k check as 'tester',
# preceded by 'ulimit -s -H unlimited' for the tests); skipped per the recipe
# conventions. The chown of the installed include dirs only undoes the
# tester ownership, so it is dropped as well.
''',
]
install_commands = [
  "make DESTDIR=$DESTDIR install",
  '''
# FHS 'historical' cpp link, computed relative inside $DESTDIR.
ln -svr $DESTDIR/usr/bin/cpp $DESTDIR/usr/lib/
''',
  "ln -sv gcc.1 $DESTDIR/usr/share/man/man1/cc.1",
  '''
# Book: ln -sfvr $(gcc -print-prog-name=liblto_plugin.so) /usr/lib/bfd-plugins/
# The new gcc is not installed yet, so take the triplet from the build tree.
GCC_LTO_PLUGIN=$DESTDIR/usr/libexec/gcc/$(./gcc/xgcc -dumpmachine)/$(cat ../gcc/BASE-VER)/liblto_plugin.so
test -f $GCC_LTO_PLUGIN
install -vd $DESTDIR/usr/lib/bfd-plugins
ln -sfvr $GCC_LTO_PLUGIN $DESTDIR/usr/lib/bfd-plugins/
''',
  '''
# The book's toolchain sanity checks (dummy.c, readelf, grep dummy.log) are
# left out: they only print output for a human.
mkdir -pv $DESTDIR/usr/share/gdb/auto-load/usr/lib
mv -v $DESTDIR/usr/lib/*gdb.py $DESTDIR/usr/share/gdb/auto-load/usr/lib
''',
]
