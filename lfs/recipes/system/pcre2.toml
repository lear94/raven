name = "pcre2"
version = "10.47"
description = "LFS 13.1 §8.13 - Perl Compatible Regular Expressions library"
dependencies = ["readline"]
source_url = "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.47/pcre2-10.47.tar.bz2"
sha256_sum = "47fe8c99461250d42f89e6e8fdaeba9da057855d06eb7fc08d9ca03fd08d7bc7"
build_commands = [
  '''
./configure --prefix=/usr                       \
            --docdir=/usr/share/doc/pcre2-10.47 \
            --enable-unicode                    \
            --enable-jit                        \
            --enable-pcre2-16                   \
            --enable-pcre2-32                   \
            --enable-pcre2grep-libz             \
            --enable-pcre2grep-libbz2           \
            --enable-pcre2test-libreadline      \
            --disable-static''',
  'make',
]
install_commands = [
  'make DESTDIR=$DESTDIR install',
]
