name = "markupsafe"
version = "3.0.3"
description = "LFS 13.1 §8.75 - Python module implementing an XML/HTML/XHTML markup safe string"
dependencies = ["vim"]
source_url = "https://pypi.org/packages/source/M/MarkupSafe/markupsafe-3.0.3.tar.gz"
sha256_sum = "722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698"
build_commands = [
  'pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD',
]
install_commands = [
  '''
# --ignore-installed/--no-deps (not in the book): with --root, pip still
# inspects the live site-packages; without them a reinstall would be a no-op
# ("already satisfied") or try to uninstall from the read-only live /usr.
pip3 install --no-index --no-user --root=$DESTDIR --ignore-installed --no-deps --find-links dist Markupsafe''',
]
