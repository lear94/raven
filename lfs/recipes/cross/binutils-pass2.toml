name = "binutils-pass2"
version = "2.47"
description = "LFS 13.1 §6.17 - Binutils, pass 2 (temporary)"
dependencies = ["xz"]
source_url = "https://sourceware.org/pub/binutils/releases/binutils-2.47.tar.xz"
sha256_sum = "154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff"
build_commands = [
  'umask 022; export PATH=$LFS/tools/bin:/usr/bin:/bin CONFIG_SITE=$LFS/usr/share/config.site LC_ALL=POSIX',
  '''
sed '6031s/$add_dir//' -i ltmain.sh''',
  '''
mkdir -v build
cd       build''',
  '''
../configure                   \
    --prefix=/usr              \
    --build=$(../config.guess) \
    --host=$LFS_TGT            \
    --disable-nls              \
    --enable-shared            \
    --enable-gprofng=no        \
    --disable-werror           \
    --enable-64-bit-bfd        \
    --enable-new-dtags         \
    --enable-default-hash-style=gnu''',
  'make',
]
install_commands = [
  'make DESTDIR=$DESTDIR$LFS install',
  'rm -v $DESTDIR$LFS/usr/lib/lib{bfd,ctf,ctf-nobfd,opcodes,sframe}.{a,la}',
]
