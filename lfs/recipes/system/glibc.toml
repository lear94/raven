name = "glibc"
version = "2.44"
description = "LFS 13.1 §8.5 - GNU C library"
dependencies = ["iana-etc"]
source_url = "https://ftpmirror.gnu.org/glibc/glibc-2.44.tar.xz"
sha256_sum = "37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667"
extra_sources = [
  { url = "https://www.linuxfromscratch.org/patches/lfs/13.1/glibc-fhs-1.patch", sha256_sum = "643552db030e2f2d7ffde4f558e0f5f83d3fabf34a2e0e56ebdb49750ac27b0d" },
  { url = "https://www.linuxfromscratch.org/patches/lfs/13.1/glibc-2.44-upstream_fixes-1.patch", sha256_sum = "500567ff0a22e295bfe3b55e9b397796f71a19f01e1ff7fb29c9189482ee1809" },
  { url = "https://www.iana.org/time-zones/repository/releases/tzdata2026c.tar.gz", sha256_sum = "e4a178a4477f3d0ea77cc31828ff72aa38feff8d61aa13e7e99e142e9d902be4" },
]
build_commands = [
  'patch -Np1 -i $RAVEN_SOURCES/glibc-fhs-1.patch',
  'patch -Np1 -i $RAVEN_SOURCES/glibc-2.44-upstream_fixes-1.patch',
  '''
mkdir -v build
cd       build''',
  '''
../configure --prefix=/usr                   \
             --disable-werror                \
             --disable-nscd                  \
             libc_cv_slibdir=/usr/lib        \
             --enable-stack-protector=strong \
             --enable-kernel=5.10''',
  'make',
  '# The book calls the Glibc test suite (make check) critical; it is skipped here.',
  "sed '/test-installation/s@$(PERL)@echo not running@' -i ../Makefile",
]
install_commands = [
  '''
# The book's "touch /etc/ld.so.conf" only silences an install warning: write
# the book's final /etc/ld.so.conf (and ld.so.conf.d) into $DESTDIR before
# "make install" instead. The book's upgrade-only steps (nscd removal,
# DESTDIR install of the shared libraries, include-fixed cleanup) do not
# apply to a fresh build. (The include-fixed fix for the chapter 6 GCC is
# not upgrade-only: it is in post_install_commands, since it edits the live
# compiler.)
install -vd $DESTDIR/etc
cat > $DESTDIR/etc/ld.so.conf << "EOF"
# Begin /etc/ld.so.conf
/usr/local/lib
/opt/lib

EOF
cat >> $DESTDIR/etc/ld.so.conf << "EOF"
# Add an include directory
include /etc/ld.so.conf.d/*.conf

EOF
mkdir -pv $DESTDIR/etc/ld.so.conf.d''',
  'make DESTDIR=$DESTDIR install',
  '''
# The ld.so.cache written by "make install" only describes $DESTDIR; it is
# regenerated for the live system by ldconfig in post_install_commands.
rm -fv $DESTDIR/etc/ld.so.cache''',
  "sed '/RTLDLIST=/s@/usr@@g' -i $DESTDIR/usr/bin/ldd",
  '''
# The book runs localedef against the installed system. Here the locale
# sources and charmaps are read from $DESTDIR (I18NPATH) and the archive is
# written to $DESTDIR/usr/lib/locale/locale-archive (--prefix). The live
# localedef is the same Glibc version (chapter 5).
mkdir -pv $DESTDIR/usr/lib/locale
export I18NPATH=$DESTDIR/usr/share/i18n
LOCALEDEF="localedef --prefix=$DESTDIR"
$LOCALEDEF -i C -f UTF-8 C.UTF-8
$LOCALEDEF -i cs_CZ -f UTF-8 cs_CZ.UTF-8
$LOCALEDEF -i de_DE -f ISO-8859-1 de_DE
$LOCALEDEF -i de_DE@euro -f ISO-8859-15 de_DE@euro
$LOCALEDEF -i de_DE -f UTF-8 de_DE.UTF-8
$LOCALEDEF -i el_GR -f ISO-8859-7 el_GR
$LOCALEDEF -i en_GB -f ISO-8859-1 en_GB
$LOCALEDEF -i en_GB -f UTF-8 en_GB.UTF-8
$LOCALEDEF -i en_HK -f ISO-8859-1 en_HK
$LOCALEDEF -i en_PH -f ISO-8859-1 en_PH
$LOCALEDEF -i en_US -f ISO-8859-1 en_US
$LOCALEDEF -i en_US -f UTF-8 en_US.UTF-8
$LOCALEDEF -i es_ES -f ISO-8859-15 es_ES@euro
$LOCALEDEF -i es_MX -f ISO-8859-1 es_MX
$LOCALEDEF -i fa_IR -f UTF-8 fa_IR
$LOCALEDEF -i fr_FR -f ISO-8859-1 fr_FR
$LOCALEDEF -i fr_FR@euro -f ISO-8859-15 fr_FR@euro
$LOCALEDEF -i fr_FR -f UTF-8 fr_FR.UTF-8
$LOCALEDEF -i is_IS -f ISO-8859-1 is_IS
$LOCALEDEF -i is_IS -f UTF-8 is_IS.UTF-8
$LOCALEDEF -i it_IT -f ISO-8859-1 it_IT
$LOCALEDEF -i it_IT -f ISO-8859-15 it_IT@euro
$LOCALEDEF -i it_IT -f UTF-8 it_IT.UTF-8
$LOCALEDEF -i ja_JP -f EUC-JP ja_JP
$LOCALEDEF -i ja_JP -f UTF-8 ja_JP.UTF-8
$LOCALEDEF -i nl_NL@euro -f ISO-8859-15 nl_NL@euro
$LOCALEDEF -i ru_RU -f KOI8-R ru_RU.KOI8-R
$LOCALEDEF -i ru_RU -f UTF-8 ru_RU.UTF-8
$LOCALEDEF -i se_NO -f UTF-8 se_NO.UTF-8
$LOCALEDEF -i ta_IN -f UTF-8 ta_IN.UTF-8
$LOCALEDEF -i tr_TR -f UTF-8 tr_TR.UTF-8
$LOCALEDEF -i zh_CN -f GB18030 zh_CN.GB18030
$LOCALEDEF -i zh_HK -f BIG5-HKSCS zh_HK.BIG5-HKSCS
$LOCALEDEF -i zh_TW -f UTF-8 zh_TW.UTF-8
unset LOCALEDEF I18NPATH''',
  '''
cat > $DESTDIR/etc/nsswitch.conf << "EOF"
# Begin /etc/nsswitch.conf

passwd: files systemd
group: files systemd
shadow: files systemd

hosts: mymachines resolve [!UNAVAIL=return] files myhostname dns
networks: files

protocols: files
services: files
ethers: files
rpc: files

# End /etc/nsswitch.conf
EOF''',
  '''
# tzdata has no top-level directory, so extract it into a directory of its
# own (the book extracts it into the build directory). zic is the live
# /usr/sbin/zic from chapter 5 (same Glibc version).
mkdir -v ../tzdata
cd       ../tzdata
tar -xf $RAVEN_SOURCES/tzdata2026c.tar.gz

ZONEINFO=$DESTDIR/usr/share/zoneinfo
mkdir -pv $ZONEINFO/{posix,right}

for tz in etcetera southamerica northamerica europe africa antarctica  \
          asia australasia backward; do
    zic -L /dev/null   -d $ZONEINFO       ${tz}
    zic -L /dev/null   -d $ZONEINFO/posix ${tz}
    zic -L leapseconds -d $ZONEINFO/right ${tz}
done

cp -v zone.tab zone1970.tab iso3166.tab $ZONEINFO
zic -d $ZONEINFO -p America/New_York
unset ZONEINFO tz''',
  '''
# The book chooses the time zone interactively with tzselect. This build is
# non-interactive, so default to UTC; re-point the link after installation.
ln -sfv /usr/share/zoneinfo/UTC $DESTDIR/etc/localtime''',
]
post_install_commands = [
  'ldconfig',
  # Book: fix the limits.h/syslimits.h of the temporary (chapter 6) GCC.
  # Harmless when they are already in place (re-runs, final GCC).
  '''
DIR=$(dirname $(gcc -print-libgcc-file-name))
[ -e $DIR/include/limits.h ]    || mv $DIR/include{-fixed,}/limits.h
[ -e $DIR/include/syslimits.h ] || mv $DIR/include{-fixed,}/syslimits.h
rm -rfv $DIR/include-fixed/*
unset DIR''',
]
