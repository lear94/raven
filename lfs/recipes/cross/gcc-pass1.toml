name = "gcc-pass1"
version = "16.2.0"
description = "LFS 13.1 §5.3 - GCC, pass 1 (cross)"
dependencies = ["binutils-pass1"]
source_url = "https://ftpmirror.gnu.org/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz"
sha256_sum = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"
extra_sources = [
  { url = "https://ftpmirror.gnu.org/mpfr/mpfr-4.2.2.tar.xz", sha256_sum = "b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01" },
  { url = "https://ftpmirror.gnu.org/gmp/gmp-6.3.0.tar.xz", sha256_sum = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898" },
  { url = "https://ftpmirror.gnu.org/mpc/mpc-1.4.1.tar.xz", sha256_sum = "91204cd32f164bd3b7c992d4a6a8ce6519511aadab30f78b6982d0bf8d73e931" },
]
build_commands = [
  'umask 022; export PATH=$LFS/tools/bin:/usr/bin:/bin CONFIG_SITE=$LFS/usr/share/config.site LC_ALL=POSIX',
  '''
tar -xf $RAVEN_SOURCES/mpfr-4.2.2.tar.xz
mv -v mpfr-4.2.2 mpfr
tar -xf $RAVEN_SOURCES/gmp-6.3.0.tar.xz
mv -v gmp-6.3.0 gmp
tar -xf $RAVEN_SOURCES/mpc-1.4.1.tar.xz
mv -v mpc-1.4.1 mpc''',
  '''
case $(uname -m) in
  x86_64)  sed -e '/m64=/s/lib64/lib/' -i.orig gcc/config/i386/t-linux64 ;;
  aarch64) sed -e '/mabi.lp64=/s/lib64/lib/' -i.orig gcc/config/aarch64/t-aarch64-linux ;;
esac''',
  '''
mkdir -v build
cd       build''',
  '''
../configure                  \
    --target=$LFS_TGT         \
    --prefix=$LFS/tools       \
    --with-glibc-version=2.44 \
    --with-sysroot=$LFS       \
    --with-newlib             \
    --without-headers         \
    --enable-default-pie      \
    --enable-default-ssp      \
    --disable-fixincludes     \
    --disable-nls             \
    --disable-shared          \
    --disable-multilib        \
    --disable-threads         \
    --disable-libatomic       \
    --disable-libgomp         \
    --disable-libquadmath     \
    --disable-libssp          \
    --disable-libvtv          \
    --disable-libstdcxx       \
    --enable-languages=c,c++''',
  'make',
]
install_commands = [
  'make DESTDIR=$DESTDIR install',
  '''
cat ../gcc/{limitx,glimits,limity}.h > \
  $DESTDIR$LFS/tools/lib/gcc/$LFS_TGT/$(cat ../gcc/BASE-VER)/include/limits.h''',
]
