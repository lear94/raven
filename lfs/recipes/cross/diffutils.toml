name = "diffutils"
version = "3.12"
description = "LFS 13.1 §6.6 - Diffutils (temporary)"
dependencies = ["coreutils"]
source_url = "https://ftpmirror.gnu.org/diffutils/diffutils-3.12.tar.xz"
sha256_sum = "7c8b7f9fc8609141fdea9cece85249d308624391ff61dedaf528fcb337727dfd"
build_commands = [
  'umask 022; export PATH=$LFS/tools/bin:/usr/bin:/bin CONFIG_SITE=$LFS/usr/share/config.site LC_ALL=POSIX',
  '''
./configure --prefix=/usr   \
            --host=$LFS_TGT \
            gl_cv_func_strcasecmp_works=yes \
            --build=$(./build-aux/config.guess)''',
  'make',
]
install_commands = [
  'make DESTDIR=$DESTDIR$LFS install',
]
