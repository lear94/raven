name = "m4"
version = "1.4.21"
description = "LFS 13.1 §6.2 - M4 (temporary)"
dependencies = ["libstdc++"]
source_url = "https://ftpmirror.gnu.org/m4/m4-1.4.21.tar.xz"
sha256_sum = "f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66"
build_commands = [
  'umask 022; export PATH=$LFS/tools/bin:/usr/bin:/bin CONFIG_SITE=$LFS/usr/share/config.site LC_ALL=POSIX',
  '''
./configure --prefix=/usr   \
            --host=$LFS_TGT \
            --build=$(build-aux/config.guess)''',
  'make',
]
install_commands = [
  'make DESTDIR=$DESTDIR$LFS install',
]
