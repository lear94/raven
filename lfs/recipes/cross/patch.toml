name = "patch"
version = "2.8"
description = "LFS 13.1 §6.13 - Patch (temporary)"
dependencies = ["make"]
source_url = "https://ftpmirror.gnu.org/patch/patch-2.8.tar.xz"
sha256_sum = "f87cee69eec2b4fcbf60a396b030ad6aa3415f192aa5f7ee84cad5e11f7f5ae3"
build_commands = [
  'umask 022; export PATH=$LFS/tools/bin:/usr/bin:/bin CONFIG_SITE=$LFS/usr/share/config.site LC_ALL=POSIX',
  '''
./configure --prefix=/usr   \
            --host=$LFS_TGT \
            --build=$(build-aux/config.guess)''',
  'make',
]
install_commands = [
  'make DESTDIR=$DESTDIR$LFS install',
]
