name = "iproute2"
version = "7.1.0"
description = "LFS 13.1 §8.67 - Programs for basic and advanced IPV4-based networking"
dependencies = ["gzip"]
source_url = "https://www.kernel.org/pub/linux/utils/net/iproute2/iproute2-7.1.0.tar.xz"
sha256_sum = "fd9fa1b95809417157ca83dd72957e3261bdbce896353cb936f80af0b33a4b5c"
build_commands = [
  '''
sed -i /ARPD/d Makefile
rm -fv man/man8/arpd.8''',
  'make NETNS_RUN_DIR=/run/netns',
]
install_commands = [
  'make DESTDIR=$DESTDIR SBINDIR=/usr/sbin install',
  'install -vDm644 COPYING README* -t $DESTDIR/usr/share/doc/iproute2-7.1.0',
]
