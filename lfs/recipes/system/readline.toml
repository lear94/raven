name = "readline"
version = "8.3"
description = "LFS 13.1 §8.12 - Readline command-line editing library"
dependencies = ["file"]
source_url = "https://ftpmirror.gnu.org/readline/readline-8.3.tar.gz"
sha256_sum = "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"
build_commands = [
  '''
sed -i '/MV.*old/d' Makefile.in
sed -i '/{OLDSUFF}/c:' support/shlib-install''',
  "sed -i 's/-Wl,-rpath,[^ ]*//' support/shobj-conf",
  '''
sed -e '270a\
     else\
       chars_avail = 1;'      \
    -e '288i\   result = -1;' \
    -i.orig input.c''',
  '''
./configure --prefix=/usr    \
            --disable-static \
            --with-curses    \
            --docdir=/usr/share/doc/readline-8.3''',
  'make SHLIB_LIBS="-lncursesw"',
]
install_commands = [
  'make DESTDIR=$DESTDIR install',
  'install -vd $DESTDIR/usr/share/doc/readline-8.3 && install -v -m644 doc/*.{ps,pdf,html,dvi} $DESTDIR/usr/share/doc/readline-8.3',
]
