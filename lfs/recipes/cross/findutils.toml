name = "findutils"
version = "4.11.0"
description = "LFS 13.1 §6.8 - Findutils (temporary)"
dependencies = ["file"]
source_url = "https://ftpmirror.gnu.org/findutils/findutils-4.11.0.tar.xz"
sha256_sum = "bfd19cb06cc71f3352d567e90284d8cdac02ac89774bbeadf0b533b0c11432fd"
build_commands = [
  'umask 022; export PATH=$LFS/tools/bin:/usr/bin:/bin CONFIG_SITE=$LFS/usr/share/config.site LC_ALL=POSIX',
  '''
./configure --prefix=/usr                   \
            --localstatedir=/var/lib/locate \
            --host=$LFS_TGT \
            --build=$(build-aux/config.guess)''',
  'make',
]
install_commands = [
  'make DESTDIR=$DESTDIR$LFS install',
]
