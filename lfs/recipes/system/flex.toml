name = "flex"
version = "2.6.4"
description = "LFS 13.1 §8.16 - Fast lexical analyzer generator"
dependencies = ["bc"]
source_url = "https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz"
sha256_sum = "e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995"
build_commands = [
  '''
./configure --prefix=/usr    \
            --disable-static \
            --docdir=/usr/share/doc/flex-2.6.4''',
  'make',
]
install_commands = [
  'make DESTDIR=$DESTDIR install',
  '''
ln -sv flex   $DESTDIR/usr/bin/lex
ln -sv flex.1 $DESTDIR/usr/share/man/man1/lex.1''',
]
