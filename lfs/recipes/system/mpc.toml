name = "mpc"
version = "1.4.1"
description = "LFS 13.1 §8.25 - Multiple precision complex arithmetic library"
dependencies = ["mpfr"]
source_url = "https://ftpmirror.gnu.org/mpc/mpc-1.4.1.tar.xz"
sha256_sum = "91204cd32f164bd3b7c992d4a6a8ce6519511aadab30f78b6982d0bf8d73e931"
build_commands = [
  '''
./configure --prefix=/usr    \
            --disable-static \
            --docdir=/usr/share/doc/mpc-1.4.1''',
  '''
make
make html''',
]
install_commands = [
  '''
make DESTDIR=$DESTDIR install
make DESTDIR=$DESTDIR install-html''',
]
