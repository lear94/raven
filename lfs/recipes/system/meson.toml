name = "meson"
version = "1.12.0"
description = "LFS 13.1 §8.59 - Meson build system"
dependencies = ["setuptools"]
source_url = "https://github.com/mesonbuild/meson/releases/download/1.12.0/meson-1.12.0.tar.gz"
sha256_sum = "88afe0c20e52030218924ac37d0c81c59b4b5f3ae3752c8c6d7470c7d365886c"
build_commands = [
  'pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD',
]
install_commands = [
  '''
# --ignore-installed/--no-deps (not in the book): with --root, pip still
# inspects the live site-packages; without them a reinstall would be a no-op
# ("already satisfied") or try to uninstall from the read-only live /usr.
pip3 install --no-index --no-user --root=$DESTDIR --ignore-installed --no-deps --find-links dist meson''',
  '''
install -vDm644 data/shell-completions/bash/meson $DESTDIR/usr/share/bash-completion/completions/meson
install -vDm644 data/shell-completions/zsh/_meson $DESTDIR/usr/share/zsh/site-functions/_meson''',
]
