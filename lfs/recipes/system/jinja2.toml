name = "jinja2"
version = "3.1.6"
description = "LFS 13.1 §8.76 - Python module implementing a template language"
dependencies = ["markupsafe"]
source_url = "https://pypi.org/packages/source/J/Jinja2/jinja2-3.1.6.tar.gz"
sha256_sum = "0137fb05990d35f1275a587e9aee6d56da821fc83491a0fb838183be43f66d6d"
build_commands = [
  'pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD',
]
install_commands = [
  '''
# --ignore-installed/--no-deps (not in the book): with --root, pip still
# inspects the live site-packages; without them a reinstall would be a no-op
# ("already satisfied") or try to uninstall from the read-only live /usr.
pip3 install --no-index --no-user --root=$DESTDIR --ignore-installed --no-deps --find-links dist Jinja2''',
]
