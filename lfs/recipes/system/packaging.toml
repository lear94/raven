name = "packaging"
version = "26.3"
description = "LFS 13.1 §8.56 - Core utilities for Python packages"
dependencies = ["flit-core"]
source_url = "https://files.pythonhosted.org/packages/source/p/packaging/packaging-26.3.tar.gz"
sha256_sum = "94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79"
build_commands = [
  "pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD",
]
install_commands = [
  '''
# Book: pip3 install --no-index --find-links dist packaging
# --root=$DESTDIR installs into /out. --ignore-installed and --no-deps keep
# pip from looking at (or trying to uninstall from) the read-only live
# system, e.g. when an older version is already installed.
pip3 install --no-index --no-deps --ignore-installed --no-user \
             --no-cache-dir --root=$DESTDIR --find-links dist packaging
''',
]
