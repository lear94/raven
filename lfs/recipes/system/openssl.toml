name = "openssl"
version = "4.0.1"
description = "LFS 13.1 §8.49 - Cryptography and TLS toolkit"
dependencies = ["automake"]
source_url = "https://github.com/openssl/openssl/releases/download/openssl-4.0.1/openssl-4.0.1.tar.gz"
sha256_sum = "2db3f3a0d6ea4b59e1f094ace2c8cd536dffb87cdc39084c5afa1e6f7f37dd09"
build_commands = [
  '''
./config --prefix=/usr         \
         --openssldir=/etc/ssl \
         --libdir=lib          \
         shared                \
         zlib-dynamic
''',
  "make",
]
install_commands = [
  '''
# Empty INSTALL_LIBS prevents the installation of static libraries (book).
make INSTALL_LIBS= MANSUFFIX=ssl DESTDIR=$DESTDIR install
''',
  "mv -v $DESTDIR/usr/share/doc/openssl $DESTDIR/usr/share/doc/openssl-4.0.1",
  "cp -vfr doc/* $DESTDIR/usr/share/doc/openssl-4.0.1",
]
