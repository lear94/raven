name = "libxcrypt"
version = "4.5.2"
description = "LFS 13.1 §8.29 - Modern password hashing library"
dependencies = ["libcap"]
source_url = "https://github.com/besser82/libxcrypt/releases/download/v4.5.2/libxcrypt-4.5.2.tar.xz"
sha256_sum = "71513a31c01a428bccd5367a32fd95f115d6dac50fb5b60c779d5c7942aec071"
build_commands = [
  "sed -i '/strchr/s/const//' lib/crypt-{sm3,gost}-yescrypt.c",
  '''
./configure --prefix=/usr                \
            --enable-hashes=strong,glibc \
            --enable-obsolete-api=no     \
            --disable-static             \
            --disable-failure-tokens''',
  'make',
]
install_commands = [
  'make DESTDIR=$DESTDIR install',
  '''
# The book's optional rebuild with --enable-obsolete-api=glibc (libcrypt.so.1
# for binary-only applications) is not done.''',
]
